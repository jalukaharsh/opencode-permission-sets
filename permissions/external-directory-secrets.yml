# external-directory-secrets
#
# Deny access to credential and shell-config locations outside the project.
# Put the `external_directory * allow` rule BEFORE this include so these denies win (last match wins).
# Paths expand `~` and `$HOME`.

- {action: external_directory, resource: "~/.ssh/**", effect: deny}
- {action: external_directory, resource: "~/.aws/**", effect: deny}
- {action: external_directory, resource: "~/.gnupg/**", effect: deny}
- {action: external_directory, resource: "/etc/**", effect: deny}
- {action: external_directory, resource: "~/.bashrc", effect: deny}
- {action: external_directory, resource: "~/.bash_profile", effect: deny}
- {action: external_directory, resource: "~/.bash_history", effect: deny}
- {action: external_directory, resource: "~/.zshrc", effect: deny}
- {action: external_directory, resource: "~/.profile", effect: deny}
- {action: external_directory, resource: "~/.gitconfig", effect: deny}
- {action: external_directory, resource: "~/.netrc", effect: deny}
- {action: external_directory, resource: "~/.git-credentials", effect: deny}
- {action: external_directory, resource: "~/.npmrc", effect: deny}
- {action: external_directory, resource: "~/.docker/config.json", effect: deny}
- {action: external_directory, resource: "~/.kube/config", effect: deny}
- {action: external_directory, resource: "~/.config/gh/**", effect: deny}
- {action: external_directory, resource: "~/.config/gcloud/**", effect: deny}
- {action: external_directory, resource: "**/.env", effect: deny}
