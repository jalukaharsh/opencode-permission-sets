# shell-readonly
#
# Read-only inspection commands. Safe to run without a prompt.
# NOTE: `find` is allowed here, so include shell-hardening AFTER this set to deny
# -delete/-exec and friends. `echo`/`printf` are allowed; redirects are denied by hardening.

- {action: shell, resource: "cat", effect: allow}
- {action: shell, resource: "cat *", effect: allow}
- {action: shell, resource: "less", effect: allow}
- {action: shell, resource: "less *", effect: allow}
- {action: shell, resource: "man", effect: allow}
